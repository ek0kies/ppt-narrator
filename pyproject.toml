[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-narrator"
version = "0.1.0"
description = "Extract PowerPoint speaker notes and generate narration assets."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ppt-narrator = "ppt_narrator.cli:main"
ppt-narrator-update = "ppt_narrator.update:main"

[tool.setuptools.packages.find]
where = ["src"]
